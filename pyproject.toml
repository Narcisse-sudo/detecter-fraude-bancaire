[project]
name = "detecter-fraude-bancaire"
version = "0.1.0"
description = "Projet end-to-end de détection de fraude bancaire."
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Your Name" }]
license = { text = "MIT" }

dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "joblib>=1.3",
  "requests>=2.32",
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "black>=24.4",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-requests>=2.32",
]

[tool.black]
line-length = 100

target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
strict = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
